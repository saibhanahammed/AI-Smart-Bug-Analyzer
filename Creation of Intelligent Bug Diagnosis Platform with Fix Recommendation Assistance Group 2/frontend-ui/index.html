<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creation of Intelligent Bug Diagnosis Platform with Fix Recommendation Assistance Group 2</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-indigo-600 selection:text-white min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [viewMode, setViewMode] = React.useState('analyzer'); // 'analyzer' or 'analytics'
            const [issueSummary, setIssueSummary] = React.useState('');
            const [uploadedFile, setUploadedFile] = React.useState(null);
            const [isAnalyzing, setIsAnalyzing] = React.useState(false);
            const [analysisResults, setAnalysisResults] = React.useState(null);
            const [kbSuccessMsg, setKbSuccessMsg] = React.useState(null);

            // Analytics State
            const [analyticsData, setAnalyticsData] = React.useState({
                total_submissions: 6,
                knowledge_base_size: 3,
                severity_breakdown: { Critical: 2, High: 2, Medium: 2, Low: 0 },
                frequent_components: [
                    ["Core::CanvasRenderer", 3],
                    ["Auth::LoginService", 2],
                    ["httpd::mod_ssl", 2],
                    ["JDT::Compiler", 1]
                ],
                systemic_patterns: [
                    ["Buffer/Hardware Overflow", 3],
                    ["Resource / Memory Leak", 2],
                    ["Connection Pool Exhaustion", 1]
                ]
            });

            React.useEffect(() => {
                fetchAnalytics();
            }, []);

            const fetchAnalytics = async () => {
                try {
                    const res = await fetch("http://127.0.0.1:8000/api/v1/analytics");
                    if (res.ok) {
                        const data = await res.json();
                        setAnalyticsData(data);
                    }
                } catch (e) {}
            };

            const handleFileUpload = (e) => {
                if (e.target.files[0]) setUploadedFile(e.target.files[0]);
            };

            const runDefectAnalysis = async () => {
                if (!uploadedFile && !issueSummary.trim()) {
                    alert("Please provide a log file or enter an issue summary.");
                    return;
                }

                setIsAnalyzing(true);
                setKbSuccessMsg(null);
                const formData = new FormData();
                if (uploadedFile) formData.append("file", uploadedFile);
                formData.append("summary", issueSummary);

                try {
                    const response = await fetch("http://127.0.0.1:8000/api/v1/analyze-log", {
                        method: "POST",
                        body: formData
                    });
                    const data = await response.json();
                    setAnalysisResults(data);
                    fetchAnalytics();
                } catch (err) {
                    alert("Failed to communicate with FastAPI backend server.");
                } finally {
                    setIsAnalyzing(false);
                }
            };

            const handleConfirmFixToKB = async () => {
                if (!analysisResults) return;
                try {
                    const payload = {
                        component: analysisResults.triage.component,
                        severity: analysisResults.triage.severity,
                        description: analysisResults.rootCause.hypothesis,
                        fix_commit: "patch-sha-" + Math.random().toString(36).substring(2, 9)
                    };
                    const res = await fetch("http://127.0.0.1:8000/api/v1/feedback/confirm-fix", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });
                    if (res.ok) {
                        const data = await res.json();
                        setKbSuccessMsg(`Added to Vector DB as ${data.entry.bug_id}`);
                        fetchAnalytics();
                    }
                } catch (e) {
                    setKbSuccessMsg("Fix logged to local knowledge base!");
                }
            };

            return (
                <div class="min-h-screen flex flex-col bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-slate-950 text-slate-100">
                    
                    {/* TOP NAVBAR */}
                    <header class="border-b border-slate-800/80 bg-slate-900/40 backdrop-blur-md px-6 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-lg bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center text-indigo-400 font-bold">
                                🐛
                            </div>
                            <div>
                            <h1 class="text-base font-bold text-white tracking-wide">Intelligent Bug Diagnosis Platform</h1>
                            <p class="text-[11px] text-slate-400">Creation of Intelligent Bug Diagnosis Platform with Fix Recommendation Assistance Group 2</p>
                        </div>
                        </div>

                        {/* TAB CONTROLS */}
                        <div class="flex items-center gap-2 bg-slate-900 p-1 border border-slate-800 rounded-xl text-xs">
                            <button 
                                onClick={() => setViewMode('analyzer')} 
                                class={`px-4 py-1.5 rounded-lg font-semibold transition-all ${
                                    viewMode === 'analyzer' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:text-white'
                                }`}
                            >
                                🔍 Defect Analyzer
                            </button>
                            <button 
                                onClick={() => { setViewMode('analytics'); fetchAnalytics(); }} 
                                class={`px-4 py-1.5 rounded-lg font-semibold transition-all ${
                                    viewMode === 'analytics' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:text-white'
                                }`}
                            >
                                📊 Pattern Analytics
                            </button>
                        </div>
                    </header>

                    {/* MAIN APPLICATION CONTAINER */}
                    <main class="flex-1 p-6 lg:p-10 space-y-8 max-w-6xl mx-auto w-full">
                        
                        {/* ================= VIEW 1: DEFECT ANALYZER ================= */}
                        {viewMode === 'analyzer' && (
                            <div class="space-y-8">
                                {/* INTAKE FORM */}
                                <div class="bg-slate-900/40 border border-slate-800/80 backdrop-blur-md rounded-2xl p-6 lg:p-8 space-y-6 shadow-xl">
                                    <div class="flex items-center gap-2 border-b border-slate-800/60 pb-3">
                                        <span class="text-lg">📥</span>
                                        <h3 class="text-sm font-bold text-white tracking-wide uppercase">Defect Intake Module</h3>
                                    </div>

                                    <div class="space-y-5">
                                        <div>
                                            <label class="text-xs font-semibold text-slate-300 mb-1.5 block">Describe the Issue (One Line)</label>
                                            <input 
                                                type="text" 
                                                value={issueSummary} 
                                                onChange={(e) => setIssueSummary(e.target.value)}
                                                placeholder="e.g. Canvas renderer crashing on high-resolution image render"
                                                class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500"
                                            />
                                        </div>

                                        <div>
                                            <label class="text-xs font-semibold text-slate-300 mb-1.5 block">Upload Telemetry / Log File</label>
                                            <div class="border-2 border-dashed border-slate-800 hover:border-indigo-500/50 rounded-xl p-6 bg-slate-950/60 transition-all text-center space-y-2">
                                                <div class="text-2xl text-slate-500">📄</div>
                                                <p class="text-xs text-slate-400">Drop your .LOG or .TXT error trace here</p>
                                                <input type="file" id="logUpload" accept=".txt,.log" onChange={handleFileUpload} class="hidden" />
                                                <label htmlFor="logUpload" class="inline-block mt-2 bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold text-xs px-4 py-2 rounded-lg cursor-pointer border border-slate-700">
                                                    Select File
                                                </label>
                                                {uploadedFile && (
                                                    <div class="text-xs font-mono text-indigo-400 mt-2 font-bold">Selected: {uploadedFile.name}</div>
                                                )}
                                            </div>
                                        </div>
                                    </div>

                                    <div class="flex justify-end pt-2">
                                        <button 
                                            onClick={runDefectAnalysis}
                                            disabled={isAnalyzing}
                                            class="bg-gradient-to-r from-indigo-600 to-sky-500 hover:from-indigo-500 hover:to-sky-400 text-white font-bold text-xs px-8 py-3 rounded-xl transition-all shadow-lg shadow-indigo-600/20 flex items-center gap-2"
                                        >
                                            {isAnalyzing ? "Executing Multi-Agent Pipeline..." : "🚀 Run Full Analysis"}
                                        </button>
                                    </div>
                                </div>

                                {/* FINDINGS SECTION */}
                                {analysisResults && (
                                    <div class="space-y-6 pt-2 animate-fade-in">
                                        <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                                            <div class="flex items-center gap-2">
                                                <span class="text-lg">🧠</span>
                                                <h2 class="text-base font-bold text-white tracking-wide">Multi-Agent Pipeline Findings</h2>
                                            </div>
                                            {kbSuccessMsg && (
                                                <span class="text-xs font-mono bg-emerald-950 text-emerald-300 border border-emerald-800 px-3 py-1 rounded-full animate-bounce">
                                                    ✓ {kbSuccessMsg}
                                                </span>
                                            )}
                                        </div>

                                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                            
                                            {/* TRIAGE AGENT */}
                                            <div class="bg-slate-900/50 border border-slate-800 rounded-2xl p-5 space-y-4 backdrop-blur-md">
                                                <div class="flex items-center gap-2 text-pink-400 font-bold text-xs uppercase tracking-wider border-b border-slate-800 pb-2">
                                                    <span>🚨</span> Triage &amp; Severity Agent
                                                </div>
                                                <div class="space-y-2 text-xs font-mono">
                                                    <div class="flex justify-between border-b border-slate-850 pb-1.5">
                                                        <span class="text-slate-400">Severity:</span>
                                                        <span class="text-red-400 font-bold">{analysisResults.triage.severity}</span>
                                                    </div>
                                                    <div class="flex justify-between border-b border-slate-850 pb-1.5">
                                                        <span class="text-slate-400">Priority:</span>
                                                        <span class="text-amber-400 font-bold">{analysisResults.triage.priority}</span>
                                                    </div>
                                                    <div class="flex justify-between border-b border-slate-850 pb-1.5">
                                                        <span class="text-slate-400">Component:</span>
                                                        <span class="text-slate-200">{analysisResults.triage.component}</span>
                                                    </div>
                                                    <div class="flex justify-between border-b border-slate-850 pb-1.5">
                                                        <span class="text-slate-400">Confidence:</span>
                                                        <span class="text-emerald-400 font-bold">{analysisResults.triage.confidence}%</span>
                                                    </div>
                                                    <p class="pt-2 text-slate-300 font-sans italic text-[11px] bg-slate-950 p-3 rounded-xl border border-slate-850">
                                                        "{analysisResults.triage.reasoning}"
                                                    </p>
                                                </div>
                                            </div>

                                            {/* LOG ANALYSIS AGENT */}
                                            <div class="bg-slate-900/50 border border-slate-800 rounded-2xl p-5 space-y-4 backdrop-blur-md">
                                                <div class="flex items-center gap-2 text-indigo-400 font-bold text-xs uppercase tracking-wider border-b border-slate-800 pb-2">
                                                    <span>🔍</span> Log Analysis Agent
                                                </div>
                                                <div class="space-y-3 text-xs font-mono">
                                                    <div>
                                                        <span class="text-slate-400 block text-[10px] uppercase font-semibold">Exception Type:</span>
                                                        <span class="text-emerald-400 font-bold">{analysisResults.logAnalysis.exceptionType}</span>
                                                    </div>
                                                    <div>
                                                        <span class="text-slate-400 block text-[10px] uppercase font-semibold">Failure Point:</span>
                                                        <span class="text-slate-200 bg-slate-950 px-2 py-1 rounded block border border-slate-850 text-[11px] truncate">
                                                            {analysisResults.logAnalysis.failurePoint}
                                                        </span>
                                                    </div>
                                                    <div>
                                                        <span class="text-slate-400 block text-[10px] uppercase font-semibold">Code Path:</span>
                                                        <span class="text-indigo-300 text-[10px] block bg-slate-950 p-2 rounded border border-slate-850">
                                                            {analysisResults.logAnalysis.path}
                                                        </span>
                                                    </div>
                                                </div>
                                            </div>

                                            {/* ROOT CAUSE AGENT */}
                                            <div class="bg-slate-900/50 border border-slate-800 rounded-2xl p-5 space-y-4 backdrop-blur-md md:col-span-2">
                                                <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                                                    <div class="flex items-center gap-2 text-sky-400 font-bold text-xs uppercase tracking-wider">
                                                        <span>🧪</span> Root Cause Agent (RAG Grounded)
                                                    </div>
                                                    <span class="text-xs font-mono text-emerald-400 bg-emerald-950/50 border border-emerald-900 px-2 py-0.5 rounded">
                                                        Confidence: {analysisResults.rootCause.confidence}%
                                                    </span>
                                                </div>
                                                <div class="space-y-3 text-xs">
                                                    <div class="bg-slate-950 p-3.5 rounded-xl border border-slate-850 text-slate-200 leading-relaxed font-sans">
                                                        <span class="text-sky-400 font-bold block mb-1 uppercase text-[10px]">Hypothesis:</span>
                                                        {analysisResults.rootCause.hypothesis}
                                                    </div>
                                                    <div class="space-y-1">
                                                        <span class="text-slate-400 font-mono text-[10px] uppercase font-semibold block">Supporting Evidence:</span>
                                                        <ul class="list-disc list-inside space-y-1 text-slate-300 font-mono text-[11px] bg-slate-950/60 p-3 rounded-xl border border-slate-850">
                                                            {analysisResults.rootCause.supportingEvidence.map((ev, i) => (
                                                                <li key={i}>{ev}</li>
                                                            ))}
                                                        </ul>
                                                    </div>
                                                </div>
                                            </div>

                                            {/* DUPLICATE AGENT */}
                                            <div class="bg-slate-900/50 border border-slate-800 rounded-2xl p-5 space-y-4 backdrop-blur-md">
                                                <div class="flex items-center gap-2 text-amber-400 font-bold text-xs uppercase tracking-wider border-b border-slate-800 pb-2">
                                                    <span>📂</span> Duplicate Detection Agent
                                                </div>
                                                <div class="space-y-2 text-xs font-mono">
                                                    {analysisResults.duplicates.map((dup, idx) => (
                                                        <div key={idx} class="bg-slate-950 p-3 rounded-xl border border-slate-850 space-y-1">
                                                            <div class="flex justify-between items-center">
                                                                <span class="text-amber-400 font-bold">{dup.id}</span>
                                                                <span class="text-emerald-400 text-[10px]">{dup.similarity}% Match</span>
                                                            </div>
                                                            <p class="text-slate-300 font-sans text-[11px] leading-tight">{dup.title}</p>
                                                            <p class="text-slate-500 font-sans text-[10px] italic">{dup.resolution}</p>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>

                                            {/* REMEDIATION AGENT & GROWTH LOOP */}
                                            <div class="bg-slate-900/50 border border-slate-800 rounded-2xl p-5 space-y-4 backdrop-blur-md flex flex-col justify-between">
                                                <div>
                                                    <div class="flex items-center gap-2 text-emerald-400 font-bold text-xs uppercase tracking-wider border-b border-slate-800 pb-2">
                                                        <span>🛠️</span> Remediation Agent
                                                    </div>
                                                    <div class="space-y-3 text-xs mt-3">
                                                        <div>
                                                            <span class="text-slate-400 font-mono text-[10px] uppercase font-semibold block mb-1">Recommended Fix:</span>
                                                            <div class="bg-slate-950 p-3.5 rounded-xl border border-slate-850 text-slate-200 leading-relaxed border-l-4 border-l-emerald-500">
                                                                {analysisResults.remediation.suggestedFix}
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>

                                                {/* MILESTONE 4 GROWTH BUTTON */}
                                                <div class="pt-4 border-t border-slate-800/80">
                                                    <button 
                                                        onClick={handleConfirmFixToKB}
                                                        class="w-full bg-emerald-600/20 hover:bg-emerald-600/30 border border-emerald-500/40 text-emerald-300 font-bold text-xs py-2.5 rounded-xl transition-all flex items-center justify-center gap-2 shadow-lg"
                                                    >
                                                        <span>💾 Confirm Fix &amp; Add to Knowledge Base</span>
                                                    </button>
                                                    <span class="text-[10px] text-slate-500 text-center block mt-1">Growth Mechanism: Dynamically improves future duplicate searches</span>
                                                </div>
                                            </div>

                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* ================= VIEW 2: DEFECT PATTERN ANALYTICS ================= */}
                        {viewMode === 'analytics' && (
                            <div class="space-y-6 animate-fade-in">
                                
                                {/* TOP METRIC COUNTERS */}
                                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                    <div class="bg-slate-900/60 border border-slate-800 p-5 rounded-2xl">
                                        <span class="text-slate-400 text-xs font-mono uppercase block">Total Processed Defects</span>
                                        <div class="text-3xl font-extrabold text-white mt-1">{analyticsData.total_submissions}</div>
                                        <span class="text-[11px] text-indigo-400 mt-1 block">Live Pipeline Ingestion</span>
                                    </div>
                                    <div class="bg-slate-900/60 border border-slate-800 p-5 rounded-2xl">
                                        <span class="text-slate-400 text-xs font-mono uppercase block">Vector KB Indexed Records</span>
                                        <div class="text-3xl font-extrabold text-emerald-400 mt-1">{analyticsData.knowledge_base_size}</div>
                                        <span class="text-[11px] text-emerald-500 mt-1 block">Self-Expanding Active Learning</span>
                                    </div>
                                    <div class="bg-slate-900/60 border border-slate-800 p-5 rounded-2xl">
                                        <span class="text-slate-400 text-xs font-mono uppercase block">Systemic Failure Clusters</span>
                                        <div class="text-3xl font-extrabold text-amber-400 mt-1">{analyticsData.systemic_patterns.length}</div>
                                        <span class="text-[11px] text-amber-500 mt-1 block">Recurring Root Cause Themes</span>
                                    </div>
                                </div>

                                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    
                                    {/* FREQUENT COMPONENTS */}
                                    <div class="bg-slate-900/40 border border-slate-800 rounded-2xl p-6 space-y-4">
                                        <h3 class="text-sm font-bold text-white uppercase tracking-wider border-b border-slate-800 pb-2">
                                            🔥 High-Frequency Affected Components
                                        </h3>
                                        <div class="space-y-3">
                                            {analyticsData.frequent_components.map(([comp, count], i) => (
                                                <div key={i} class="space-y-1">
                                                    <div class="flex justify-between text-xs font-mono">
                                                        <span class="text-slate-200">{comp}</span>
                                                        <span class="text-indigo-400 font-bold">{count} occurrences</span>
                                                    </div>
                                                    <div class="w-full bg-slate-950 rounded-full h-2 overflow-hidden border border-slate-800">
                                                        <div class="bg-indigo-500 h-full rounded-full" style={{ width: `${Math.min((count / analyticsData.total_submissions) * 100, 100)}%` }}></div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    {/* SEVERITY BREAKDOWN */}
                                    <div class="bg-slate-900/40 border border-slate-800 rounded-2xl p-6 space-y-4">
                                        <h3 class="text-sm font-bold text-white uppercase tracking-wider border-b border-slate-800 pb-2">
                                            🚨 Defect Severity Distribution
                                        </h3>
                                        <div class="grid grid-cols-2 gap-3 pt-2">
                                            <div class="bg-red-950/40 border border-red-900/50 p-4 rounded-xl text-center">
                                                <span class="text-red-400 text-xs font-mono font-bold block uppercase">Critical</span>
                                                <span class="text-2xl font-bold text-white mt-1 block">{analyticsData.severity_breakdown.Critical}</span>
                                            </div>
                                            <div class="bg-orange-950/40 border border-orange-900/50 p-4 rounded-xl text-center">
                                                <span class="text-orange-400 text-xs font-mono font-bold block uppercase">High</span>
                                                <span class="text-2xl font-bold text-white mt-1 block">{analyticsData.severity_breakdown.High}</span>
                                            </div>
                                            <div class="bg-yellow-950/40 border border-yellow-900/50 p-4 rounded-xl text-center">
                                                <span class="text-yellow-400 text-xs font-mono font-bold block uppercase">Medium</span>
                                                <span class="text-2xl font-bold text-white mt-1 block">{analyticsData.severity_breakdown.Medium}</span>
                                            </div>
                                            <div class="bg-blue-950/40 border border-blue-900/50 p-4 rounded-xl text-center">
                                                <span class="text-blue-400 text-xs font-mono font-bold block uppercase">Low</span>
                                                <span class="text-2xl font-bold text-white mt-1 block">{analyticsData.severity_breakdown.Low}</span>
                                            </div>
                                        </div>
                                    </div>

                                </div>

                                {/* SYSTEMIC ROOT CAUSE THEMES */}
                                <div class="bg-slate-900/40 border border-slate-800 rounded-2xl p-6 space-y-3">
                                    <h3 class="text-sm font-bold text-white uppercase tracking-wider border-b border-slate-800 pb-2">
                                        ⚡ Systemic Root Cause Themes &amp; Architectural Debt
                                    </h3>
                                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 pt-2">
                                        {analyticsData.systemic_patterns.map(([theme, count], idx) => (
                                            <div key={idx} class="bg-slate-950 p-4 rounded-xl border border-slate-800">
                                                <span class="text-amber-400 font-mono font-bold text-xs uppercase block">Pattern #{idx + 1}</span>
                                                <h4 class="text-slate-200 font-semibold text-xs mt-1">{theme}</h4>
                                                <p class="text-[11px] text-slate-500 mt-2">Correlated with {count} recent stack trace failures across modules.</p>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                            </div>
                        )}

                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
